<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6">
  <title>Libreca</title>
  <link rel="icon" href="src/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles/fonts.css">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main>
    <!-- Library (home): the book in progress. -->
    <section class="screen" data-screen="library" aria-labelledby="library-title" hidden>
      <header class="app-header">
        <h1 id="library-title" class="brand" tabindex="-1">
          <svg class="brand-mark" viewBox="0 0 88 88" aria-hidden="true">
            <path class="brand-corners" d="M8 24V8h16M64 8h16v16M80 64v16H64M24 80H8V64"/>
            <path class="brand-book" d="M44 30c-7-5-15-6-22-5v35c7-1 15 0 22 5 7-5 15-6 22-5V25c-7-1-15 0-22 5zM44 30v35"/>
          </svg>
          <span class="wordmark" aria-hidden="true">libre<span>ca</span></span>
          <span class="visually-hidden" data-i18n="app.title">Libreca</span>
        </h1>
        <button type="button" class="btn btn-secondary btn-icon" data-action="settings" data-i18n-attr="aria-label:settings.title;title:settings.title"><span data-icon="settings"></span></button>
      </header>
      <p class="tagline" data-i18n="app.tagline"></p>

      <div class="section-head">
        <h2 class="label" data-i18n="library.books"></h2>
        <button id="library-new" type="button" class="btn btn-accent"><span data-icon="plus"></span><span data-i18n="library.new"></span></button>
      </div>
      <p id="library-none" class="meta" data-i18n="library.none" hidden></p>
      <ul id="library-list" class="book-list"></ul>
      <output id="save-status" class="status" aria-live="polite"></output>

      <p class="privacy"><span data-icon="lock"></span><span data-i18n="app.privacy"></span></p>
    </section>

    <!-- Capture: full screen, always in the Nuit theme. -->
    <section class="screen screen-capture theme-nuit" data-screen="capture" aria-labelledby="capture-title" hidden>
      <div class="capture-top">
        <a class="btn btn-secondary btn-icon" href="#/book" data-i18n-attr="aria-label:capture.close;title:capture.close"><span data-icon="close"></span></a>
        <h1 id="capture-title" class="capture-title book-title" tabindex="-1" data-book-title></h1>
        <output id="capture-next" class="chip"></output>
      </div>
      <div id="viewer" class="viewer">
        <video id="camera-preview" playsinline muted></video>
        <canvas id="page-overlay" class="overlay" aria-hidden="true"></canvas>
        <output id="camera-status" class="viewer-message"></output>
        <div class="viewer-top viewer-chips">
          <output id="detect-chip" class="chip chip-overlay"></output>
          <output id="finger-chip" class="chip chip-overlay"></output>
          <output id="blur-chip" class="chip chip-overlay"></output>
          <output id="light-chip" class="chip chip-overlay"></output>
        </div>
        <output id="scan-status" class="chip chip-overlay viewer-bottom"></output>
      </div>
      <div class="capture-tools" role="toolbar" data-i18n-attr="aria-label:camera.tools">
        <button id="camera-rotate-left" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:orientation.rotateLeft;title:orientation.rotateLeft"><span data-icon="rotate-left"></span></button>
        <button id="camera-rotate-right" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:orientation.rotateRight;title:orientation.rotateRight"><span data-icon="rotate-right"></span></button>
        <button id="camera-mirror" type="button" class="btn btn-secondary btn-icon" aria-pressed="false" data-i18n-attr="aria-label:orientation.mirror;title:orientation.mirror"><span data-icon="mirror"></span></button>
        <button id="camera-switch" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:camera.switch;title:camera.switch" hidden><span data-icon="switch-camera"></span></button>
        <button type="button" class="btn btn-secondary btn-icon" data-action="settings" data-i18n-attr="aria-label:settings.title;title:settings.title"><span data-icon="settings"></span></button>
      </div>
      <div class="capture-strip">
        <ol id="capture-strip" class="strip" data-i18n-attr="aria-label:pages.title"></ol>
        <span id="capture-count" class="meta"></span>
      </div>
      <div class="capture-bottom">
        <button id="capture-auto" type="button" class="btn btn-secondary capture-slot" aria-pressed="true" data-i18n-attr="title:capture.autoHelp"><span data-icon="auto"></span><span data-i18n="capture.auto"></span></button>
        <button id="capture" type="button" class="shutter" data-mode="auto" aria-keyshortcuts="Space" data-i18n-attr="aria-label:scan.capture;title:scan.captureHelp" disabled></button>
        <a class="btn btn-primary capture-slot" href="#/book" data-i18n="capture.finish"></a>
      </div>
    </section>

    <!-- Book: pages and PDF export. -->
    <section class="screen" data-screen="book" aria-labelledby="book-title" hidden>
      <div class="top-bar">
        <a class="btn btn-secondary btn-icon" href="#/" data-i18n-attr="aria-label:nav.back;title:nav.back"><span data-icon="back"></span></a>
        <button type="button" class="btn btn-secondary btn-icon" data-action="settings" data-i18n-attr="aria-label:settings.title;title:settings.title"><span data-icon="settings"></span></button>
      </div>
      <div class="book-hero">
        <div id="book-cover" class="book-cover"></div>
        <div class="book-hero-body">
          <div class="title-row">
            <h1 id="book-title" class="book-title screen-title" tabindex="-1" data-book-title></h1>
            <button id="book-rename" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:book.rename;title:book.rename"><span data-icon="edit"></span></button>
          </div>
          <p id="book-meta" class="meta"></p>
        </div>
      </div>
      <div class="section-head">
        <h2 class="label" data-i18n="pages.title"></h2>
        <div class="btn-row">
          <button id="book-organize" type="button" class="btn btn-secondary" aria-pressed="false" data-i18n-attr="title:book.organizeHelp"><span data-icon="edit"></span><span data-i18n="book.organize"></span></button>
          <a class="btn btn-secondary" href="#/capture"><span data-icon="camera"></span><span data-i18n="book.capture"></span></a>
        </div>
      </div>
      <ol id="page-list" class="pages"></ol>
      <section class="card export-panel" aria-labelledby="export-title">
        <h2 id="export-title" data-i18n="book.exportTitle"></h2>
        <button id="export-pdf" type="button" class="btn btn-accent" disabled><span data-icon="export"></span><span data-i18n="pages.export"></span></button>
        <output id="export-status" class="status" aria-live="polite"></output>
      </section>
    </section>

    <!-- Page review: one straightened page. -->
    <section class="screen" data-screen="page" aria-labelledby="review-title" hidden>
      <div class="top-bar">
        <a class="btn btn-secondary btn-icon" href="#/book" data-i18n-attr="aria-label:nav.back;title:nav.back"><span data-icon="back"></span></a>
        <h1 id="review-title" class="top-bar-title" tabindex="-1"></h1>
        <button type="button" class="btn btn-secondary btn-icon" data-action="settings" data-i18n-attr="aria-label:settings.title;title:settings.title"><span data-icon="settings"></span></button>
      </div>
      <div id="review-compare" class="review-stage compare">
        <img id="review-before" class="compare-before" alt="">
        <img id="review-image" class="compare-after" alt="">
        <span class="compare-tag compare-tag-before" data-i18n="review.before" aria-hidden="true"></span>
        <span class="compare-tag compare-tag-after" data-i18n="review.after" aria-hidden="true"></span>
      </div>
      <label class="compare-control">
        <span class="label" data-i18n="review.compare"></span>
        <input id="review-compare-range" type="range" min="0" max="100" step="1" value="50">
      </label>
      <div class="review-corrections" role="group" aria-labelledby="review-corrections-title">
        <h2 id="review-corrections-title" class="label" data-i18n="review.corrections"></h2>
        <div id="review-correction-list" class="chip-row"></div>
        <label class="field field-inline">
          <span data-i18n="review.color"></span>
          <select id="review-color"></select>
        </label>
      </div>
      <div class="review-tools">
        <output id="review-state" class="chip"></output>
        <div class="btn-row" role="toolbar" data-i18n-attr="aria-label:orientation.tools">
          <button id="review-rotate-left" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:orientation.rotateLeft;title:orientation.rotateLeft"><span data-icon="rotate-left"></span></button>
          <button id="review-rotate-right" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:orientation.rotateRight;title:orientation.rotateRight"><span data-icon="rotate-right"></span></button>
          <button id="review-mirror" type="button" class="btn btn-secondary btn-icon" data-i18n-attr="aria-label:orientation.mirror;title:orientation.mirror"><span data-icon="mirror"></span></button>
        </div>
      </div>
      <output id="review-status" class="status" aria-live="polite"></output>
      <div class="review-actions">
        <button id="review-delete" type="button" class="btn btn-secondary btn-danger"><span data-icon="trash"></span><span data-i18n="review.delete"></span></button>
        <div class="btn-pair">
          <button id="review-adjust" type="button" class="btn btn-secondary"><span data-icon="corners"></span><span data-i18n="review.adjust"></span></button>
          <button id="review-retake" type="button" class="btn btn-secondary"><span data-icon="retake"></span><span data-i18n="review.retake"></span></button>
          <a class="btn btn-primary" href="#/book"><span data-icon="check"></span><span data-i18n="review.done"></span></a>
        </div>
      </div>
    </section>
  </main>

  <!-- Spoken announcements (screen readers): captures and capture hints. -->
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <!-- Settings and checks: a dialog open over any screen. -->
  <dialog id="settings-dialog" class="dialog settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <button type="button" class="btn btn-secondary btn-icon" data-action="close" data-i18n-attr="aria-label:settings.close;title:settings.close"><span data-icon="close"></span></button>
    </div>
    <section aria-labelledby="settings-general">
      <h3 id="settings-general" class="label" data-i18n="settings.general"></h3>
      <label class="field">
        <span data-i18n="settings.language"></span>
        <select id="language-select"></select>
      </label>
      <label class="field">
        <span data-i18n="settings.theme"></span>
        <select id="theme-select"></select>
      </label>
      <label class="field">
        <span data-i18n="camera.source"></span>
        <select id="camera-select" disabled></select>
      </label>
    </section>
    <section aria-labelledby="settings-capture">
      <h3 id="settings-capture" class="label" data-i18n="settings.capture"></h3>
      <label class="field">
        <span data-i18n="settings.colorMode"></span>
        <select id="color-select"></select>
      </label>
      <label class="toggle">
        <span data-i18n="settings.splitSpreads"></span>
        <input id="split-toggle" type="checkbox" role="switch">
      </label>
      <label id="vibrate-row" class="toggle">
        <span data-i18n="settings.vibrate"></span>
        <input id="vibrate-toggle" type="checkbox" role="switch">
      </label>
      <label class="toggle">
        <span data-i18n="settings.sound"></span>
        <input id="sound-toggle" type="checkbox" role="switch">
      </label>
    </section>
    <section aria-labelledby="diag-title">
      <h3 id="diag-title" class="label" data-i18n="diagnostics.title"></h3>
      <ul class="checks">
        <li><span data-i18n="diagnostics.secureContext"></span> <output id="secure-status" class="chip"></output></li>
        <li><span data-i18n="diagnostics.opencv"></span> <output id="opencv-status" class="chip"></output></li>
      </ul>
    </section>
  </dialog>

  <dialog id="corner-dialog" class="dialog corner-dialog" aria-labelledby="corner-title">
    <h2 id="corner-title" data-i18n="corners.title"></h2>
    <p class="meta" data-i18n="corners.help"></p>
    <div class="corner-stage">
      <img alt="" draggable="false">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon></polygon></svg>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.topLeft;title:corners.topLeft"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.topRight;title:corners.topRight"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.bottomRight;title:corners.bottomRight"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.bottomLeft;title:corners.bottomLeft"></button>
    </div>
    <div class="row end">
      <button type="button" class="btn btn-secondary" data-action="reset"><span data-icon="corners"></span><span data-i18n="corners.reset"></span></button>
      <div class="btn-pair">
        <button type="button" class="btn btn-secondary" data-action="cancel" data-i18n="corners.cancel"></button>
        <button type="button" class="btn btn-primary" data-action="apply" data-i18n="corners.apply"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
