<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libreca</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 data-i18n="app.title">Libreca</h1>
    <p class="tagline" data-i18n="app.tagline"></p>
  </header>

  <main>
    <section class="card" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <label class="field">
        <span data-i18n="settings.language"></span>
        <select id="language-select"></select>
      </label>
    </section>

    <section class="card" aria-labelledby="diag-title">
      <h2 id="diag-title" data-i18n="diagnostics.title"></h2>
      <ul class="checks">
        <li><span data-i18n="diagnostics.secureContext"></span> <output id="secure-status"></output></li>
        <li><span data-i18n="diagnostics.opencv"></span> <output id="opencv-status"></output></li>
      </ul>
    </section>

    <section class="card" aria-labelledby="camera-title">
      <h2 id="camera-title" data-i18n="camera.title"></h2>
      <div class="row">
        <label class="field">
          <span data-i18n="camera.source"></span>
          <select id="camera-select" disabled></select>
        </label>
        <button id="camera-start" type="button" data-i18n="camera.start"></button>
        <button id="camera-stop" type="button" data-i18n="camera.stop" disabled></button>
      </div>
      <output id="camera-status" class="status"></output>
      <div id="viewer" class="viewer" hidden>
        <video id="camera-preview" playsinline muted></video>
        <canvas id="page-overlay" class="overlay" aria-hidden="true"></canvas>
      </div>
      <div class="row">
        <button id="capture" type="button" class="primary" data-i18n="scan.capture" disabled></button>
      </div>
      <output id="scan-status" class="status" aria-live="polite"></output>
    </section>

    <section class="card" aria-labelledby="pages-title">
      <h2 id="pages-title" data-i18n="pages.title"></h2>
      <ol id="page-list" class="pages"></ol>
      <div class="row">
        <button id="export-pdf" type="button" data-i18n="pages.export" disabled></button>
      </div>
      <output id="export-status" class="status" aria-live="polite"></output>
    </section>
  </main>

  <dialog id="corner-dialog" class="corner-dialog" aria-labelledby="corner-title">
    <h2 id="corner-title" data-i18n="corners.title"></h2>
    <p data-i18n="corners.help"></p>
    <div class="corner-stage">
      <img alt="" draggable="false">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon></polygon></svg>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.topLeft;title:corners.topLeft"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.topRight;title:corners.topRight"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.bottomRight;title:corners.bottomRight"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.bottomLeft;title:corners.bottomLeft"></button>
    </div>
    <div class="row end">
      <button type="button" data-action="reset" data-i18n="corners.reset"></button>
      <button type="button" data-action="cancel" data-i18n="corners.cancel"></button>
      <button type="button" data-action="apply" class="primary" data-i18n="corners.apply"></button>
    </div>
  </dialog>
</body>
</html>
