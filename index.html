<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6">
  <title>Libreca</title>
  <link rel="icon" href="src/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles/fonts.css">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main>
    <!-- Library (home): the book in progress. -->
    <section class="screen" data-screen="library" aria-labelledby="library-title" hidden>
      <header class="app-header">
        <h1 id="library-title" class="brand" tabindex="-1">
          <svg class="brand-mark" viewBox="0 0 88 88" aria-hidden="true">
            <path class="brand-corners" d="M8 24V8h16M64 8h16v16M80 64v16H64M24 80H8V64"/>
            <path class="brand-book" d="M44 30c-7-5-15-6-22-5v35c7-1 15 0 22 5 7-5 15-6 22-5V25c-7-1-15 0-22 5zM44 30v35"/>
          </svg>
          <span class="wordmark" aria-hidden="true">libre<span>ca</span></span>
          <span class="visually-hidden" data-i18n="app.title">Libreca</span>
        </h1>
        <a class="btn btn-secondary btn-icon" href="#/settings" data-i18n-attr="aria-label:settings.title;title:settings.title"><span data-icon="settings"></span></a>
      </header>
      <p class="tagline" data-i18n="app.tagline"></p>

      <article class="book-card card" aria-labelledby="library-book-title">
        <div id="library-cover" class="book-cover"></div>
        <div class="book-card-body">
          <h2 id="library-book-title" class="book-title" data-i18n="book.untitled"></h2>
          <p id="library-book-meta" class="meta"></p>
          <a id="library-open" class="btn btn-secondary" href="#/book" hidden><span data-icon="book"></span><span data-i18n="library.open"></span></a>
        </div>
      </article>

      <div class="screen-actions">
        <a class="btn btn-accent" href="#/capture"><span data-icon="camera"></span><span data-i18n="library.scan"></span></a>
      </div>

      <p class="privacy"><span data-icon="lock"></span><span data-i18n="app.privacy"></span></p>
    </section>

    <!-- Capture: full screen, always in the Nuit theme. -->
    <section class="screen screen-capture theme-nuit" data-screen="capture" aria-labelledby="capture-title" hidden>
      <div class="capture-top">
        <a class="btn btn-secondary btn-icon" href="#/book" data-i18n-attr="aria-label:capture.close;title:capture.close"><span data-icon="close"></span></a>
        <h1 id="capture-title" class="capture-title book-title" tabindex="-1" data-i18n="book.untitled"></h1>
        <output id="capture-next" class="chip"></output>
      </div>
      <div id="viewer" class="viewer">
        <video id="camera-preview" playsinline muted></video>
        <canvas id="page-overlay" class="overlay" aria-hidden="true"></canvas>
        <output id="camera-status" class="viewer-message"></output>
        <output id="detect-chip" class="chip chip-overlay viewer-top"></output>
        <output id="scan-status" class="chip chip-overlay viewer-bottom" aria-live="polite"></output>
      </div>
      <div class="capture-strip">
        <ol id="capture-strip" class="strip" data-i18n-attr="aria-label:pages.title"></ol>
        <span id="capture-count" class="meta"></span>
      </div>
      <div class="capture-bottom">
        <span class="capture-slot"></span>
        <button id="capture" type="button" class="shutter" data-mode="manual" data-i18n-attr="aria-label:scan.capture;title:scan.capture" disabled></button>
        <a class="btn btn-primary capture-slot" href="#/book" data-i18n="capture.finish"></a>
      </div>
    </section>

    <!-- Book: pages and PDF export. -->
    <section class="screen" data-screen="book" aria-labelledby="book-title" hidden>
      <div class="top-bar">
        <a class="btn btn-secondary btn-icon" href="#/" data-i18n-attr="aria-label:nav.back;title:nav.back"><span data-icon="back"></span></a>
      </div>
      <h1 id="book-title" class="book-title screen-title" tabindex="-1" data-i18n="book.untitled"></h1>
      <p id="book-meta" class="meta"></p>
      <div class="section-head">
        <h2 class="label" data-i18n="pages.title"></h2>
        <a class="btn btn-secondary" href="#/capture"><span data-icon="camera"></span><span data-i18n="book.capture"></span></a>
      </div>
      <ol id="page-list" class="pages"></ol>
      <section class="card export-panel" aria-labelledby="export-title">
        <h2 id="export-title" data-i18n="book.exportTitle"></h2>
        <button id="export-pdf" type="button" class="btn btn-accent" disabled><span data-icon="export"></span><span data-i18n="pages.export"></span></button>
        <output id="export-status" class="status" aria-live="polite"></output>
      </section>
    </section>

    <!-- Page review: one straightened page. -->
    <section class="screen" data-screen="page" aria-labelledby="review-title" hidden>
      <div class="top-bar">
        <a class="btn btn-secondary btn-icon" href="#/book" data-i18n-attr="aria-label:nav.back;title:nav.back"><span data-icon="back"></span></a>
        <h1 id="review-title" class="top-bar-title" tabindex="-1"></h1>
        <span class="top-bar-slot"></span>
      </div>
      <div class="review-stage">
        <img id="review-image" alt="">
      </div>
      <output id="review-state" class="chip"></output>
      <output id="review-status" class="status" aria-live="polite"></output>
      <div class="review-actions">
        <button id="review-delete" type="button" class="btn btn-secondary btn-danger"><span data-icon="trash"></span><span data-i18n="review.delete"></span></button>
        <div class="btn-pair">
          <button id="review-adjust" type="button" class="btn btn-secondary"><span data-icon="corners"></span><span data-i18n="review.adjust"></span></button>
          <a class="btn btn-primary" href="#/book" data-i18n="review.done"></a>
        </div>
      </div>
    </section>

    <!-- Settings and checks. -->
    <section class="screen" data-screen="settings" aria-labelledby="settings-title" hidden>
      <div class="top-bar">
        <a class="btn btn-secondary btn-icon" href="#/" data-i18n-attr="aria-label:nav.back;title:nav.back"><span data-icon="back"></span></a>
      </div>
      <h1 id="settings-title" class="screen-title" tabindex="-1" data-i18n="settings.title"></h1>
      <section class="card" aria-labelledby="settings-general">
        <h2 id="settings-general" data-i18n="settings.general"></h2>
        <label class="field">
          <span data-i18n="settings.language"></span>
          <select id="language-select"></select>
        </label>
        <label class="field">
          <span data-i18n="settings.theme"></span>
          <select id="theme-select"></select>
        </label>
        <label class="field">
          <span data-i18n="camera.source"></span>
          <select id="camera-select" disabled></select>
        </label>
      </section>
      <section class="card" aria-labelledby="diag-title">
        <h2 id="diag-title" data-i18n="diagnostics.title"></h2>
        <ul class="checks">
          <li><span data-i18n="diagnostics.secureContext"></span> <output id="secure-status" class="chip"></output></li>
          <li><span data-i18n="diagnostics.opencv"></span> <output id="opencv-status" class="chip"></output></li>
        </ul>
      </section>
    </section>
  </main>

  <dialog id="corner-dialog" class="corner-dialog" aria-labelledby="corner-title">
    <h2 id="corner-title" data-i18n="corners.title"></h2>
    <p class="meta" data-i18n="corners.help"></p>
    <div class="corner-stage">
      <img alt="" draggable="false">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon></polygon></svg>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.topLeft;title:corners.topLeft"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.topRight;title:corners.topRight"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.bottomRight;title:corners.bottomRight"></button>
      <button type="button" class="handle" data-i18n-attr="aria-label:corners.bottomLeft;title:corners.bottomLeft"></button>
    </div>
    <div class="row end">
      <button type="button" class="btn btn-secondary" data-action="reset"><span data-icon="corners"></span><span data-i18n="corners.reset"></span></button>
      <div class="btn-pair">
        <button type="button" class="btn btn-secondary" data-action="cancel" data-i18n="corners.cancel"></button>
        <button type="button" class="btn btn-primary" data-action="apply" data-i18n="corners.apply"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
